# Автоматическая сборка и публикация сайта.
# Запускается при любом изменении в ветке main, а также вручную
# кнопкой Run workflow на вкладке Actions.

name: Сборка и публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# если правки идут одна за другой — публикуем последнюю, лишние отменяем
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Собрать страницы
    runs-on: ubuntu-latest
    steps:
      - name: Забрать файлы репозитория
        uses: actions/checkout@v4

      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Собрать сайт
        run: python build_pages.py

      - name: Проверить, что сборка не пустая
        run: |
          test -f dist/index.html
          test -f dist/events.html
          test -f dist/CNAME
          echo "Страниц собрано: $(find dist -name '*.html' | wc -l)"

      - name: Передать результат на публикацию
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Опубликовать
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
